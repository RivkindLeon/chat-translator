name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Проверка синтаксиса
        run: |
          node --check index.js
          for f in src/*.js tools/*.mjs; do node --check "$f"; done
      - name: Тесты
        run: node test.mjs
